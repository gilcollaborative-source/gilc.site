name: Build and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Cloud Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloud Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment on server..."
            sudo mkdir -p /opt/web-stack/nginx/conf.d /opt/web-stack/nginx/certs /opt/web-stack/certbot/www /opt/web-stack/data/db
            sudo chown -R $USER:$USER /opt/web-stack
            cd /opt/web-stack
            
            # Fetch latest docker-compose.yml and nginx config with cache-buster
            curl -fsSL "https://raw.githubusercontent.com/gilcollaborative-source/gilc.site/main/docker-compose.yml?ts=$(date +%s)" -o docker-compose.yml
            curl -fsSL "https://raw.githubusercontent.com/gilcollaborative-source/gilc.site/main/nginx/conf.d/default.conf?ts=$(date +%s)" -o nginx/conf.d/default.conf
            
            # Enforce exact image repository name
            sed -i 's|ghcr.io/gilcollaborative/|ghcr.io/gilcollaborative-source/|g' docker-compose.yml
            
            # Ensure SSL directory and initial placeholder certificate exist for Nginx to boot
            if [ ! -f /opt/web-stack/nginx/certs/live/gilcollaborative.com/fullchain.pem ]; then
              mkdir -p /opt/web-stack/nginx/certs/live/gilcollaborative.com
              openssl req -x509 -nodes -newkey rsa:2048 -days 30 -subj "/CN=gilcollaborative.com" \
                -keyout /opt/web-stack/nginx/certs/live/gilcollaborative.com/privkey.pem \
                -out /opt/web-stack/nginx/certs/live/gilcollaborative.com/fullchain.pem
            fi

            # Authenticate GHCR on server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            
            # Pull latest application image and start entire stack
            docker compose pull app
            docker compose up -d --remove-orphans
            
            # Clean up dangling images to conserve memory and disk
            docker image prune -f
            echo "Deployment completed successfully!"
